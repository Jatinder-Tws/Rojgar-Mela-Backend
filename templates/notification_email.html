<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }} – JobMatch AI</title>
</head>
<body style="margin:0;padding:0;background:#f0f4f8;font-family:'DM Sans',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f4f8;padding:40px 20px;">
    <tr>
      <td align="center">
        <table width="580" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg,#1a2a6c,#2a3d8f,#3a5098);padding:28px 40px;text-align:center;">
              <span style="font-size:20px;font-weight:700;color:#ffffff;font-family:'Plus Jakarta Sans',Arial,sans-serif;">💼 JobMatch AI</span>
            </td>
          </tr>
          <tr>
            <td style="padding:40px 48px 32px;">
              <p style="margin:0 0 4px 0;font-size:14px;color:#6366f1;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;">Notification</p>
              <h1 style="margin:0 0 16px 0;font-size:24px;font-weight:700;color:#1e293b;font-family:'Plus Jakarta Sans',Arial,sans-serif;">{{ title }}</h1>
              <p style="color:#64748b;font-size:16px;line-height:1.6;margin:0 0 24px 0;">
                Hi <strong>{{ first_name }}</strong>,
              </p>
              <div style="background:#f8fafc;border-radius:12px;padding:20px;border:1px solid #e2e8f0;margin:0 0 24px 0;">
                <p style="color:#334155;font-size:15px;line-height:1.7;margin:0;">{{ message }}</p>
              </div>
              <p style="color:#94a3b8;font-size:13px;margin:0;">Log in to your dashboard to take action.</p>
            </td>
          </tr>
          <tr>
            <td style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:24px 48px;text-align:center;">
              <p style="margin:0;color:#94a3b8;font-size:13px;">© {{ year }} JobMatch AI · All rights reserved</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

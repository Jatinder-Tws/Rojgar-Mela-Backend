services:
  postgres:
    container_name: rojgar-mela-postgres
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jobmatch_db
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmatch -d jobmatch_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: rojgar-mela-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    container_name: rojgar-mela-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobmatch:secret@postgres:5432/jobmatch_db
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:5173
      - PYTHONPATH=/app
      - WATCHFILES_FORCE_POLLING=true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 2"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  celery-worker:
    container_name: rojgar-mela-celery-worker
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobmatch:secret@postgres:5432/jobmatch_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    command: celery -A app.core.celery_app worker --loglevel=info -Q high_priority,emails,broadcast,ai_and_heavy,default --pool=solo

  celery-beat:
    container_name: rojgar-mela-celery-beat
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobmatch:secret@postgres:5432/jobmatch_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      celery-worker:
        condition: service_started
    volumes:
      - .:/app
    command: celery -A app.core.celery_app beat --loglevel=info

volumes:
  pg_data:
  redis_data:
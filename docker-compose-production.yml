services:
  redis:
    container_name: rojgar-mela-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379" # Exposed on different port to avoid conflicts with local dev
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: rojgar-mela-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8001:8000" # Exposed on 8001 so it doesn't clash with local dev
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    # In production, we typically don't use --reload.
    command: sh -c "python scripts/run_migrations.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"

  celery-worker:
    container_name: rojgar-mela-celery-worker
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo

  celery-beat:
    container_name: rojgar-mela-celery-beat
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONPATH=/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    volumes:
      - .:/app
    command: celery -A app.core.celery_app beat --loglevel=info

volumes:
  redis_data_prod:
